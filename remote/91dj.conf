# QX 配置片段：91短剧 / 91国产（qpkx.fzmyb.jevyq）
# 用途：抓 /api/app/* 的请求，以及播放列表 `/api/app/vid/h5/m3u8/...`（拿到 token 就能直接播放）。
#
# 两种用法，任选其一：
#   A. 本地配置：把下面 [mitm] 与 [rewrite_local] 两段整体粘进 QX 的配置文件（推荐，最稳）
#   B. 远程资源：QX → 设置 → 资源 → 重写 → 新增，资源路径填
#        https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/remote/91dj.rules.conf
#      然后把下面 [mitm] 里的主机名手工加到 QX → 设置 → MitM → 主机名

[mitm]
hostname = %APPEND% 91hts.rlkfus.cn, tyuio.rlkfus.cn, dp539615g9mv7.cloudfront.net, rs2sts.pjrwfe.cn, *.pjrwfe.cn, *.rlkfus.cn

[rewrite_local]
^https?:\/\/[^/]+\/api\/app\/vid\/h5\/m3u8\/ url script-request-header https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_m3u8.js
^https?:\/\/[^/]+\/api\/app\/ url script-request-header https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_capture.js
^https?:\/\/[^/]+\/api\/app\/ url script-response-body https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_capture.js
