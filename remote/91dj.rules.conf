# 91短剧 / 91国产 —— QuantumultX 远程重写资源（配合 [rewrite_remote] 引用）
# 第一行是 QX 的 hostname 指令：只把「需要抓包的接口域名」并入 MitM（%APPEND% = 追加，不覆盖你已有的）。
#
# 重要：脚本已改成「原样放行」（request-header 返回 headers、response-body 返回原 body）。
# 之前的版本返回空对象，会把 /api/app/* 的响应体清空，App 就会报「APP线路检测失败 / 选线失败」。
#
# 注意：不要加 *.pjrwfe.cn / rs2sts.pjrwfe.cn / *.rlkfus.cn —— 那些是分片 CDN 和线路探测域名。
hostname = %APPEND% 91hts.rlkfus.cn, tyuio.rlkfus.cn, dp539615g9mv7.cloudfront.net

^https?:\/\/[^/]+\/api\/app\/vid\/h5\/m3u8\/ url script-request-header https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_m3u8.js
^https?:\/\/[^/]+\/api\/app\/ url script-request-header https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_capture.js
^https?:\/\/[^/]+\/api\/app\/ url script-response-body https://raw.githubusercontent.com/teng662858/QuantumultX-Rewrites/main/scripts/91dj_capture.js
