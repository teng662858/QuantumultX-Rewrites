# 91短剧 / 91国产 —— QuantumultX 资源【结论：对这台 App 不可用】

## 实测结论（2026-11-22）

这个 App 做了 **TLS 证书校验（pinning）**：只要它的接口域名（`91hts.rlkfus.cn` 等）被 MitM 解密，
App 的「APP线路检测」就失败，弹「选线失败 / 检测失败」，播放器只剩 21 秒预览。

因此**任何** MitM 方案都不行，跟脚本有没有 bug 无关：

| 尝试 | 结果 |
| --- | --- |
| 资源里带 `hostname = %APPEND% …`（自动并入 MitM） | App 选线失败 |
| 手指把 3 个域名加到 MitM、资源关掉 | 仍然失败（说明是 MitM 本身，而不是重写规则） |
| 只保留「播放列表一条 request-header 规则」（本文件） | 仍然失败 |
| 关闭资源 + 清空 MitM 主机名 | **App 恢复正常** |
| 脚本早期用 `$persistentStore`（QX 无此对象） | 抛异常，日志报 `Can't find variable: $persistentStore`（已修，但不是主因） |

## 所以怎么用

- **不要**给这台 App 开 MitM，App 才能正常看（预览 / VIP 提示照旧）。
- 抓包改走**模拟器**（雷电 9 + root + 内存 dump），已经跑通完整链路：
  `playlist token → m3u8 → 分片 → /api/app/vid/sec 的 16 字节密钥 → AES-128-CBC/IV=0 → 合法 MPEG-TS`。
- 脚本留在仓库里，给**其它没有证书校验**的 App 复用；用法见 README。
